<div id="game-container">
    <canvas #rendererCanvas id="renderCanvas"></canvas>

    <!-- Loading Screen -->
    <div class="loading-screen" *ngIf="gameState.isLoading">
        <div class="loading-content">
            <div class="loading-title">LOADING</div>
            <div class="loading-bar-container">
                <div class="loading-bar"></div>
            </div>
            <div class="loading-text">Preparing textures...</div>
        </div>
    </div>

    <div id="hud" [class.hidden]="gameState.isLoading">
        <div class="hud-top-left">
            <div class="stat-box">
                <span class="label">LEVEL</span>
                <span class="value">{{gameState.level}}</span>
            </div>
            <div class="stat-box">
                <span class="label">SCORE</span>
                <span class="value">{{gameState.score}}</span>
            </div>
        </div>

        <div class="hud-top-center">
            <div class="health-bar-container">
                <div class="health-bar" [style.width.%]="(gameState.health / gameState.maxHealth) * 100"></div>
                <span class="health-text">{{gameState.health | number:'1.0-0'}} / {{gameState.maxHealth}}</span>
            </div>
            <div class="xp-bar-container">
                <div class="xp-bar" [style.width.%]="(gameState.xp / gameState.xpToLevel) * 100"></div>
            </div>
        </div>

        <div class="hud-top-right">
            <div class="stat-box">
                <span class="label">WAVE</span>
                <span class="value">{{gameState.wave}}</span>
            </div>
        </div>

        <!-- Debug Mode Indicator -->
        <div class="debug-indicator" *ngIf="gameState.debugMode">
            <span>DEBUG MODE</span>
            <div class="debug-legend">
                <div class="legend-item"><span class="color-dot green"></span> Player Collision (r=1.5)</div>
                <div class="legend-item"><span class="color-dot red"></span> Enemy Collision (r=1.5)</div>
                <div class="legend-item"><span class="color-dot yellow"></span> Sprite Footprint</div>
                <div class="legend-item"><span class="color-dot cyan"></span> Map Boundary</div>
            </div>
            <span class="hint">Collision: dist &lt; 3.0</span>
            <span class="hint">Ctrl+D to toggle</span>
        </div>
    </div>

    <!-- Level Up Screen (Roulette System) -->
    <app-level-up *ngIf="gameState.isLevelingUp"
        [characterId]="characterId"
        (upgradeSelected)="onUpgradeSelected($event)">
    </app-level-up>

    <!-- Pause Menu -->
    <app-pause-menu *ngIf="gameState.isPaused" (resume)="onResume()" (quit)="onQuit()"></app-pause-menu>

    <!-- Game Over Screen -->
    <app-game-over *ngIf="gameState.isGameOver" [score]="gameState.score" [level]="gameState.level"
        (returnToMenu)="onReturnToMenu()" (playAgain)="onPlayAgain()">
    </app-game-over>

    <!-- Developer Console -->
    <app-dev-console></app-dev-console>

    <!-- Minimap -->
    <app-minimap [size]="180" [scale]="2"></app-minimap>
</div>
