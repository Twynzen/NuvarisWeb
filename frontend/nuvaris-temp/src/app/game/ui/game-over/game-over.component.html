<div class="game-over-overlay">
    <div class="game-over-container">
        <h1 class="title death-title">HAS MUERTO</h1>

        <div class="stats">
            <div class="stat">
                <span class="label">NIVEL ALCANZADO</span>
                <span class="value">{{level}}</span>
            </div>
            <div class="stat">
                <span class="label">PUNTUACION</span>
                <span class="value">{{score}}</span>
            </div>
        </div>

        <div class="buttons">
            <button (click)="onReturnToMenu()" class="menu-btn">VOLVER AL MENU</button>
        </div>
    </div>
</div>
