<div class="level-up-overlay" [class.show-result]="showFinalResult">
  <div class="container">
    <!-- Title -->
    <h1 class="title">SYSTEM UPGRADE</h1>
    <p class="subtitle" *ngIf="!allLanesStopped">ANALYZING NEURAL PATHWAYS...</p>
    <p class="subtitle" *ngIf="allLanesStopped && !showFinalResult">PROCESSING...</p>

    <!-- Slot Machine Container -->
    <div class="slot-machine" *ngIf="!showFinalResult">
      <!-- Lane indicators -->
      <div class="lane-container">
        <div class="slot-lane"
             *ngFor="let lane of lanes; let i = index"
             [class.spinning]="lane.isSpinning"
             [class.stopped]="!lane.isSpinning">

          <!-- Slot viewport -->
          <div class="slot-viewport">
            <div class="slot-reel">
              <!-- Current visible item -->
              <div class="slot-item" [ngClass]="getLaneCurrentItem(lane).displayClass">
                <div class="item-icon" [innerHTML]="getSafeSvg(getLaneCurrentItem(lane).skillIcon)"></div>
                <span class="item-name">{{ getLaneCurrentItem(lane).name }}</span>
                <span class="item-rarity">{{ getRarityText(getLaneCurrentItem(lane).rarity) }}</span>
              </div>
            </div>
          </div>

          <!-- Lane number indicator -->
          <div class="lane-indicator">{{ i + 1 }}</div>

          <!-- Stopped indicator -->
          <div class="stopped-badge" *ngIf="!lane.isSpinning">
            <span class="checkmark">&#10003;</span>
          </div>
        </div>
      </div>

      <!-- Selection pointer -->
      <div class="selection-pointer">
        <div class="pointer-arrow"></div>
      </div>
    </div>

    <!-- Final Result -->
    <div class="final-result" *ngIf="showFinalResult && finalSelection">
      <div class="result-banner" [ngClass]="finalSelection.displayClass">
        UPGRADE ACQUIRED
      </div>

      <div class="winner-card" [ngClass]="finalSelection.displayClass">
        <div class="winner-glow"></div>
        <div class="winner-icon" [innerHTML]="getSafeSvg(finalSelection.skillIcon)"></div>
        <h2 class="winner-name">{{ finalSelection.name }}</h2>
        <p class="winner-description">{{ finalSelection.description }}</p>
        <span class="winner-rarity">{{ getRarityText(finalSelection.rarity) }}</span>
      </div>

      <div class="auto-apply-indicator">
        <span class="loading-dots">INSTALLING</span>
      </div>
    </div>
  </div>
</div>
