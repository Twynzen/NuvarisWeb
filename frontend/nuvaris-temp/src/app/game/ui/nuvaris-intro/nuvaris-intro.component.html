<div class="nuvaris-container">
    <!-- Cosmic fog layers -->
    <div class="fog-layer fog-1"></div>
    <div class="fog-layer fog-2"></div>
    <div class="fog-layer fog-3"></div>

    <!-- Dynamic star field -->
    <canvas #starCanvas class="star-canvas"></canvas>

    <!-- Main content -->
    <div class="content">
        <h1 class="title" [class.visible]="showTitle">NUVARIS</h1>
        <p class="prompt" [class.visible]="showPrompt">Presiona cualquier tecla para continuar...</p>
    </div>

    <!-- Vignette overlay -->
    <div class="vignette"></div>
</div>
